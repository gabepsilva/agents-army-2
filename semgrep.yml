rules:
  - id: no-shell-true-subprocess
    languages: [python]
    severity: ERROR
    message: >-
      subprocess call uses shell=True. Every backend here builds a CLI
      command from a user-supplied prompt (see backends/claude.py,
      backends/codex.py, backends/grok.py); shell=True on that path is
      command injection. Pass args as a list instead.
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: no-inherited-env-agent-subprocess
    languages: [python]
    severity: ERROR
    message: >-
      subprocess call inside AgentGateway, or one launching the agent CLI
      (orchestrator/bwrap) by a literal argv, does not pass env=. This
      guards a Python driver that spawns the agent CLI on the project's
      behalf, by requiring an explicit env=. The driver it was written for
      was removed in #80, and its replacement is a shell script, so this
      rule currently matches nothing in this tree and is held for the next
      Python one. It is not a statement about today's agent turns:
      backends/*.py spawn the CLIs with the host environment inherited,
      deliberately, because each CLI needs its login under the real $HOME.
    patterns:
      - pattern-either:
          # Any subprocess launch inside AgentGateway, whatever the argv
          # expression looks like -- this is the class that owns the single
          # sandboxed turn, so every subprocess call it makes must be
          # explicit about its environment.
          - patterns:
              - pattern-inside: |
                  class AgentGateway:
                      ...
              - pattern-either:
                  - pattern: subprocess.run(...)
                  - pattern: subprocess.Popen(...)
              - pattern-not: subprocess.run(..., env=..., ...)
              - pattern-not: subprocess.Popen(..., env=..., ...)
          # Defense in depth outside AgentGateway: a literal orchestrator/
          # bwrap argv anywhere else in the codebase without env=.
          - patterns:
              - pattern-either:
                  - pattern: subprocess.run(["orchestrator", ...], ...)
                  - pattern: subprocess.run(["bwrap", ...], ...)
                  - pattern: subprocess.Popen(["orchestrator", ...], ...)
                  - pattern: subprocess.Popen(["bwrap", ...], ...)
              - pattern-not: subprocess.run(["orchestrator", ...], ..., env=..., ...)
              - pattern-not: subprocess.run(["bwrap", ...], ..., env=..., ...)
              - pattern-not: subprocess.Popen(["orchestrator", ...], ..., env=..., ...)
              - pattern-not: subprocess.Popen(["bwrap", ...], ..., env=..., ...)

  - id: no-bare-except
    languages: [python]
    severity: WARNING
    message: >-
      Bare `except:` swallows every exception, including the ones a caller
      needs to see (KeyboardInterrupt, a genuine bug). Name the exception
      type(s) actually expected.
    patterns:
      - pattern: |
          try:
              ...
          except:
              ...
