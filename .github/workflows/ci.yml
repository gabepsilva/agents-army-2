name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Two gates are time-dependent rather than change-dependent: pip-audit's
  # advisory feed and the Gitleaks rule set both move without this repository
  # changing. Everything else is pinned and hermetic, so a weekly run on
  # unchanged code is deterministic — which also makes it a canary for a
  # yanked package version, a missing action revision, or a vanished Semgrep
  # image digest. A red scheduled run blocks nothing; it is an alarm.
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick quality and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.11

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run quick quality and policy gates
        run: make verify-quick
        env:
          # Compare thresholds against the branch this change targets, not a
          # hardcoded master, so the ratchet is correct on stacked branches.
          RATCHET_BASE: origin/${{ github.base_ref || github.ref_name }}

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.11

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run coverage gates
        run: make verify-coverage

      # Per-file floors hold the line where it already is; this holds new work
      # to a higher bar than the legacy files it lands in.
      - name: Check coverage of changed lines
        if: github.event_name == 'pull_request'
        run: make diff-coverage DIFF_BASE=origin/${{ github.base_ref }}

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            coverage.xml
            coverage.json

  mutation:
    name: Mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.11

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      # mutation-v1 is the format version for this cache's own digest scheme
      # (tools/mutation_cache.py); bump it to flush every cache in scope on a
      # deliberate change to what that digest covers.
      - name: Restore mutation cache
        id: mutation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mutants
            reports/mutation-test-inputs.sha256
          key: mutation-v1-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mutation-v1-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - name: Run mutation gate
        run: make verify-mutation

      # Restore/save are split around the gate so a saved cache always
      # carries a digest written by a run that measured and cleared the
      # floor: `make verify-mutation` only records after mutmut has measured
      # and mutation_gate.py has passed, and `if: success()` means a failed
      # or cancelled run publishes nothing.
      - name: Save mutation cache
        if: success() && steps.mutation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mutants
            reports/mutation-test-inputs.sha256
          key: mutation-v1-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}

  security-static:
    name: Static security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.11

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run static security gates
        run: make verify-security

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/

  quality-gate:
    name: Quality and security
    needs: [quick, coverage, mutation, security-static]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every quality lane to succeed
        env:
          LANE_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$LANE_RESULTS" = "success success success success"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: 8.30.0
