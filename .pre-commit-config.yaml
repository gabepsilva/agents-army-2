minimum_pre_commit_version: 4.0.0
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: verify
        name: Local quality gate
        entry: make verify
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: complete-gate
        name: Complete quality and security gate
        entry: make ci
        language: system
        pass_filenames: false
        stages: [pre-push]
